<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Mantenimiento de Cliente</title>
    <link rel="stylesheet" href="style.css">
    <script src="clienteCrud.js"></script>
</head>
<body>
    <div class="form-container">
        <h1 id="form-heading">Formulario de Cliente</h1>

        <form id="formularioCliente">
            <div>
                <label for="id">Código:</label><br>
                <input type="text" id="id" name="id" readonly disabled>
            </div>
            <br>

            <div>
                <label for="identificacion">Identificación:</label><br>
                <input type="text" id="identificacion" name="identificacion" required>
            </div>
            <br>

            <div>
                <label for="nombre">Nombre:</label><br>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <br>

            <div>
                <label for="apellido">Apellido:</label><br>
                <input type="text" id="apellido" name="apellido" required>
            </div>
            <br>

            <div>
                <label for="correo">Correo Electrónico:</label><br>
                <input type="email" id="correo" name="correo" required>
            </div>
            <br>

            <div>
                <label for="telefono">Teléfono:</label><br>
                <input type="text" id="telefono" name="telefono">
            </div>
            <br>

            <div>
                <label for="celular">Celular:</label><br>
                <input type="text" id="celular" name="celular">
            </div>
            <br>

            <div>
                <label for="genero">Género:</label><br>
                <select id="genero" name="genero">
                    <option value="m">Masculino</option>
                    <option value="f">Femenino</option>
                    <option value="o">Otro</option>
                </select>
            </div>
            <br>

            <div>
                <label for="direccion">Dirección:</label><br>
                <input type="text" id="direccion" name="direccion">
            </div>
            <br>

            <div>
                <label for="fechaRegistro">Fecha de Registro:</label><br>
                <input type="text" id="fechaRegistro" name="fechaRegistro" readonly disabled>
            </div>
            <br>

            <div>
                <label for="estado">Estado:</label><br>
                <select id="estado" name="estado">
                    <option value="true">Activo</option>
                    <option value="false">Inactivo</option>
                </select>
            </div>
            <br>

            <div>
                <button type="submit" id="btnSubmit">Guardar</button>
                <button type="button" id="btnCancel" class="btn-cancelar">Cancelar</button>
            </div>
        </form>
    </div>
</body>
</html>
